<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages can't send headers, so the policy lives here (frame-ancestors can't; app.js refuses to run framed) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src https:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14111b">
<title>Tajná brána</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<!-- Knock target + ports, AES-GCM encrypted with the secret (PBKDF2-SHA256); generated by knockpage.py -->
<script id="locks" type="application/json">@LOCKS@</script>
<script src="scene.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main class="wrap">
  <div class="frame"><canvas id="scene" width="160" height="120" aria-hidden="true"></canvas></div>

  <section class="panel">
    <h1><canvas id="keyicon" width="16" height="6" aria-hidden="true"></canvas><span data-t="title">Tajná brána</span></h1>
    <p data-t="intro">Fotky a další poklady jsou schované za bránou. Zadej tajné slovo a brána se ti na 12&nbsp;hodin otevře.</p>

    <form id="form" autocomplete="off">
      <label for="secret" data-t="label">Tajné slovo</label>
      <div class="row">
        <input id="secret" name="secret" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
        <button id="go" class="btn" type="submit" data-t="go">Odemknout</button>
      </div>
      <label class="check"><input id="remember" type="checkbox" checked><span data-t="remember">Zapamatovat si slovo na tomto zařízení</span></label>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <p id="done" class="done" hidden><a id="continue" class="btn" href="https://fotky.gregy.cz/" data-t="toPhotos">Pokračovat do fotek</a></p>

    <p class="hint" data-t="hint">Brána se otevře jen pro síť, ze které jsi právě připojený. Když přejdeš na jinou Wi-Fi nebo na mobilní data (nebo za 12&nbsp;hodin), otevři tuhle stránku znovu.</p>
    <p id="forgetwrap" class="forget" hidden><button type="button" id="forget" class="linklike" data-t="forget">Zapomenout uložené slovo</button></p>
  </section>
</main>
<noscript><p class="panel" lang="cs">Brána potřebuje zapnutý JavaScript.</p><p class="panel" lang="en">The gate needs JavaScript turned on.</p></noscript>
</body>
</html>
